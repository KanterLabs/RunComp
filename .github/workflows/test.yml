name: RunComp checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test on homelab runner
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Set up the locked pnpm version
        run: corepack enable && corepack prepare "$(node -p "require('./package.json').packageManager || 'pnpm@10.11.0'")" --activate
      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: Production build
        run: pnpm build
